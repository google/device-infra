edition = "2024";

package mobileharness.api.deviceconfig;

import "src/devtools/mobileharness/api/deviceconfig/proto/basic.proto";

option java_package = "com.google.devtools.mobileharness.api.deviceconfig.proto";

// The global config, stored as a singleton per config service deployment.
message GlobalConfig {
  // The device config template to *copy from* when adding new devices. When
  // this is present, the lab level default device config will be ignored.
  BasicDeviceConfig device_config_template = 1;
}
