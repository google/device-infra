// Configuration messages for OmniLab Gateway sessions and jobs.

syntax = "proto2";

package mobileharness.gateway;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "src/devtools/mobileharness/api/model/proto/job.proto";
import "src/java/com/google/wireless/qa/mobileharness/shared/proto/common.proto";
import "src/java/com/google/wireless/qa/mobileharness/shared/proto/job.proto";
import "src/java/com/google/wireless/qa/mobileharness/shared/proto/job_config.proto";
import "src/java/com/google/wireless/qa/mobileharness/shared/proto/spec/job_spec.proto";

option java_package = "com.google.devtools.mobileharness.api.gateway.proto";
option java_outer_classname = "Setting";

// Configuration for a single OmniLab job within a Gateway session.
//
// Next tag: 20
message JobConfig {
  // Name of the job. If multiple jobs in the same session share a name, Gateway
  // appends a `_${index}` suffix to disambiguate them.
  optional string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Username (`run_as`) that executes the job. Defaults to `SessionConfig.user`
  // if unset.
  optional string user = 2 [(google.api.field_behavior) = OPTIONAL];

  // Device type, driver, and decorator stack for the job.
  //
  // `type.driver` is required. `type.device` (and `type.decorator`) may be
  // omitted when `sub_device_spec` is set, in which case `SessionRunnerImpl`
  // populates `type.device` and `type.decorator` (reversed from
  // `sub_device_spec[0].decorators`) from `sub_device_spec[0]`. When both
  // `type.device` and `sub_device_spec` are set, `JobConfigConverter` validates
  // that `sub_device_spec[0].type` equals `type.device` and
  // `sub_device_spec[0].decorators` equals `type.decorator` in reverse order
  // (throwing `JOB_SPEC_INVALID_JOB_TYPE_ERROR` on mismatch), and only merges
  // `sub_device_spec[0].dimensions` into the first device.
  optional mobileharness.shared.JobType type = 3
      [(google.api.field_behavior) = REQUIRED];

  // Top-level device dimensions applied to all devices in the job. Keys
  // specified here override conflicting keys in `sub_device_spec`.
  repeated mobileharness.shared.StrPair dimension = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Driver and decorator parameters passed as key-value pairs.
  repeated mobileharness.shared.StrPair param = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Input files for the job, where `name` is the file tag and `value` is the
  // file path or URI. Multiple entries with the same tag are grouped together.
  repeated mobileharness.shared.StrPair file = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Explicit test names (such as test classes or methods) to run in the job.
  repeated string test = 7 [(google.api.field_behavior) = OPTIONAL];

  // Job, test, and start timeout settings.
  optional mobileharness.shared.Timeout timeout = 8
      [(google.api.field_behavior) = OPTIONAL];

  // Retry policy (`test_attempts` and `retry_level`) for failed tests.
  optional mobileharness.api.model.Retry retry = 16
      [(google.api.field_behavior) = OPTIONAL];

  // Repeat execution count (`repeat_runs`) for the job.
  optional mobileharness.api.model.Repeat repeat = 17
      [(google.api.field_behavior) = OPTIONAL];

  // Per-device specifications for single- or multi-device jobs.
  //
  // If `type.device` is omitted, `SessionRunnerImpl` populates `type.device`
  // and `type.decorator` (reversed from `sub_device_spec[0].decorators`) from
  // `sub_device_spec[0]`. If both `type.device` and `sub_device_spec` are
  // provided, `JobConfigConverter` validates that `sub_device_spec[0].type`
  // equals `type.device` and `sub_device_spec[0].decorators` equals
  // `type.decorator` in reverse order (throwing
  // `JOB_SPEC_INVALID_JOB_TYPE_ERROR` on mismatch), and only merges
  // `sub_device_spec[0].dimensions` into the first device.
  //
  // If both `dimension` and `sub_device_spec` provide dimensions for the same
  // key, the one in `dimension` will override the one in `sub_device_spec` to
  // match production behavior. Top-level `dimension`s apply to all devices.
  repeated mobileharness.client.JobConfig.SubDeviceSpec sub_device_spec = 18
      [(google.api.field_behavior) = OPTIONAL];

  // Dimension keys whose values must be identical across all sub-devices
  // allocated to the job.
  repeated string shared_dimension_names = 19
      [(google.api.field_behavior) = OPTIONAL];

  // Key-value properties set on `JobInfo` when the job is created.
  repeated mobileharness.shared.StrPair property = 11
      [(google.api.field_behavior) = OPTIONAL];

  // Typed driver and decorator `JobSpec` protobuf configuration.
  optional mobileharness.shared.spec.JobSpec job_spec = 12
      [(google.api.field_behavior) = OPTIONAL];

  // OmniLab master server spec for this job. Overridden by
  // `SessionConfig.master_spec` if set.
  optional string master_spec = 14 [(google.api.field_behavior) = OPTIONAL];

  // Scheduling priority of the job.
  optional mobileharness.shared.Priority priority = 15
      [default = DEFAULT, (google.api.field_behavior) = OPTIONAL];

  reserved 9, 10, 13;
}
