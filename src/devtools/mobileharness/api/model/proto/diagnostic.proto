syntax = "proto3";

package mobileharness.api.model;

import "src/devtools/common/metrics/stability/model/proto/exception.proto";

option java_package = "com.google.devtools.mobileharness.api.model.proto";
option java_outer_classname = "Diagnostic";

// A finding is a piece of information about an execution that is considered
// noteworthy.
message Finding {
  // Details of the finding.
  stability.model.ExceptionDetail detail = 1;

  // Severity of the finding.
  enum Severity {
    // Default unspecified severity.
    // Do not use. For versioning only.
    SEVERITY_UNSPECIFIED = 0;
    // Non critical finding, providing users with some info about the test run.
    INFO = 1;
    // Non critical finding, providing users with some hints on improving their
    // testing experience.
    SUGGESTION = 2;
    // Potentially critical finding.
    WARNING = 3;
    // Critical finding.
    SEVERE = 4;
  }

  // Severity of the finding.
  Severity severity = 2;
}
