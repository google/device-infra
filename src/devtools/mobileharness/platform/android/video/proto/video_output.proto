syntax = "proto2";

package mobileharness.platform.android.video;

import "google/protobuf/timestamp.proto";

option java_package = "com.google.devtools.mobileharness.platform.android.video.proto";
option java_multiple_files = true;
option java_outer_classname = "VideoOutputProto";

message VideoOutput {
  enum VideoType {
    VIDEO_TYPE_UNSPECIFIED = 0;
    STITCHED_SCREENSHOTS = 1;
    EMULATOR_CONSOLE = 2;
    VIDEOCAT = 3;
    SCREENRECORD = 4;
  }
  optional VideoType video_type = 1;
  // relative path to the test's gen_file_dir
  repeated string generated_file_names = 2;
  optional google.protobuf.Timestamp start_time = 3;
  optional google.protobuf.Timestamp end_time = 4;

  enum ContainerFormat {
    CONTAINER_FORMAT_UNSPECIFIED = 0;
    WEBM = 1;
    MPEGTS = 2;
    PNG = 3;
    MP4 = 4;
  }
  optional ContainerFormat container_format = 5;
}
