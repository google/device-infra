<div class="master-detail-layout-container">
  @if (navList().length > 0) {
    <div class="master-detail-layout-nav-container">
      <div class="master-detail-layout-nav-surface">
        <nav
          #navListEl
          class="master-detail-layout-nav"
          aria-label="Page sections"
        >
          @for (nav of navList(); track nav.id) {
            <a
              #navLink
              [href]="'#' + nav.id"
              class="master-detail-layout-nav-link"
              [class.active]="nav.id === activeSection()"
              [attr.aria-current]="nav.id === activeSection() ? 'location' : null"
              (click)="scrollToSection($event, nav.id)"
              >{{ nav.label }}</a
            >
          }
        </nav>
      </div>
    </div>
  }
  <div class="master-detail-layout-content-cards">
    <ng-content></ng-content>
  </div>
</div>
