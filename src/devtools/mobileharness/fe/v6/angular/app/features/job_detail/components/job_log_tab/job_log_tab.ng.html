<app-streaming-log-viewer
  [id]="jobId()"
  logTitle="Job Log"
  [cloudLogLink]="cloudLogLink()"
  [fetchStrategy]="logStrategy"
  [initialScrollPosition]="isJobRunning() ? 'bottom' : 'top'"
  emptyMessage="No logs available for this job."
  (streamCompleted)="streamCompleted.emit()"
></app-streaming-log-viewer>
