@if (configResult$ | async; as configResult) {
  @if (configResult.hostConfig || isAts) {
    <app-host-settings
      [hostName]="data.hostName"
      [config]="configResult.hostConfig ?? undefined"
    ></app-host-settings>
  } @else {
    <app-host-empty
      [hostName]="data.hostName"
      emptyTitle="This host has an empty configuration. Choose how to begin."
    ></app-host-empty>
  }
}
