@let t = task();

@if (t.isLoading()) {
  <div class="bw-panel-status" role="status" aria-live="polite">
    <mat-spinner diameter="18" />
    <span class="bw-panel-status-text">{{ loadingText() }}</span>
  </div>
} @else if (t.error(); as err) {
  <div class="bw-panel-status bw-panel-status-error" role="alert">
    <mat-icon class="bw-panel-status-icon material-symbols-outlined">error</mat-icon>
    <span class="bw-panel-status-text">{{ err }}</span>
    <button
      type="button"
      class="bw-text-btn"
      (click)="t.retry()"
    >
      Retry
    </button>
  </div>
}
