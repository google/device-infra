<app-streaming-log-viewer
  [id]="testId()"
  logTitle="Test Log"
  [cloudLogLink]="cloudLogLink()"
  [fetchStrategy]="logStrategy"
  [initialScrollPosition]="isTestRunning() ? 'bottom' : 'top'"
  emptyMessage="No logs available for this test."
  (streamCompleted)="streamCompleted.emit()"
></app-streaming-log-viewer>
