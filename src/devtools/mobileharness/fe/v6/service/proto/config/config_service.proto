syntax = "proto3";

package devtools.mobileharness.fe.v6.service.proto.config;

import "google/api/annotations.proto";
import "src/devtools/mobileharness/fe/v6/service/proto/config/config_resources.proto";

option java_package = "com.google.devtools.mobileharness.fe.v6.service.proto.config";
option java_multiple_files = true;
option java_outer_classname = "ConfigServiceProto";

// Service definition for configuration management operations.
service ConfigService {
  // Retrieves the configuration for a specific device.
  rpc GetDeviceConfig(GetDeviceConfigRequest)
      returns (GetDeviceConfigResponse) {
    option (google.api.http) = {
      get: "/v6/devices/{id}/config"
    };
  }

  // Checks if the current user has permission to modify device configuration.
  //
  // Deprecated: use CheckDeviceConfigPermission instead.
  rpc CheckDeviceWritePermission(CheckDeviceWritePermissionRequest)
      returns (CheckDeviceWritePermissionResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:checkWritePermission",
      body: "*"
    };
    option deprecated = true;
  }

  // Checks if the current user has permission to modify device configuration.
  rpc CheckDeviceConfigPermission(CheckDeviceConfigPermissionRequest)
      returns (CheckDeviceConfigPermissionResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:checkConfigPermission",
      body: "*"
    };
  }

  // Updates the configuration for a specific device.
  rpc UpdateDeviceConfig(UpdateDeviceConfigRequest)
      returns (UpdateDeviceConfigResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:update",
      body: "*"
    };
  }

  // Retrieves a list of recommended Wi-Fi networks.
  rpc GetRecommendedWifi(GetRecommendedWifiRequest)
      returns (GetRecommendedWifiResponse) {
    option (google.api.http) = {
      get: "/v6/configs/wifi/recommendations"
    };
  }

  // Retrieves the default DeviceConfig set at the host level.
  rpc GetHostDefaultDeviceConfig(GetHostDefaultDeviceConfigRequest)
      returns (GetHostDefaultDeviceConfigResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}:getDefaultDeviceConfig",
      body: "*"
    };
  }

  // Retrieves the configuration and UI control status for a specific host.
  rpc GetHostConfig(GetHostConfigRequest) returns (GetHostConfigResponse) {
    option (google.api.http) = {
      get: "/v6/hosts/{host_name}/config"
    };
  }

  // Checks if the current user has permission to modify host configuration.
  //
  // Deprecated: use CheckHostConfigPermission instead.
  rpc CheckHostWritePermission(CheckHostWritePermissionRequest)
      returns (CheckHostWritePermissionResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:checkWritePermission",
      body: "*"
    };
    option deprecated = true;
  }

  // Checks if the current user has permission to modify host configuration.
  rpc CheckHostConfigPermission(CheckHostConfigPermissionRequest)
      returns (CheckHostConfigPermissionResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:checkConfigPermission",
      body: "*"
    };
  }

  // Updates the configuration for a specific host.
  rpc UpdateHostConfig(UpdateHostConfigRequest)
      returns (UpdateHostConfigResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:update",
      body: "*"
    };
  }

  // Unlocks the host properties by disabling Config Pusher management.
  rpc UnlockHostProperties(UnlockHostPropertiesRequest)
      returns (UnlockHostPropertiesResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:unlockHostProperties",
      body: "*"
    };
  }

  // Retrieves dimensions available for batch configuration.
  rpc GetConfigurableDimensions(GetConfigurableDimensionsRequest)
      returns (GetConfigurableDimensionsResponse) {
    option (google.api.http) = {
      get: "/v6/configs/dimensions:configurable"
    };
  }

  // Retrieves current dimension values for target devices and candidate values
  // to pick from.
  rpc GetBatchDimensionContext(GetBatchDimensionContextRequest)
      returns (GetBatchDimensionContextResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchGetDimensionContext"
      body: "*"
    };
  }

  // Retrieves current Wi-Fi configuration for target devices and candidate
  // networks.
  rpc GetBatchWifiContext(GetBatchWifiContextRequest)
      returns (GetBatchWifiContextResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchGetWifiContext"
      body: "*"
    };
  }

  // Applies a batch configuration change across target devices.
  rpc BatchUpdateDeviceConfig(BatchUpdateDeviceConfigRequest)
      returns (BatchUpdateDeviceConfigResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchUpdateConfig"
      body: "*"
    };
  }
}

// Request for GetDeviceConfig.
message GetDeviceConfigRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;

  // The host name of the lab the device connects to.
  string host_name = 3;
}

// Response for GetDeviceConfig.
message GetDeviceConfigResponse {
  DeviceConfig device_config = 1;
  bool is_host_managed = 2;
  string host_name = 3;
  DeviceConfigUiStatus ui_status = 4;
}

// Request for CheckDeviceWritePermission.
message CheckDeviceWritePermissionRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for CheckDeviceWritePermission.
message CheckDeviceWritePermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for CheckDeviceConfigPermission.
message CheckDeviceConfigPermissionRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for CheckDeviceConfigPermission.
message CheckDeviceConfigPermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Error details for update operations.
message UpdateError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    SELF_LOCKOUT_DETECTED = 1;
    PERMISSION_DENIED = 2;
    VALIDATION_ERROR = 3;
    UNKNOWN = 4;
  }
  Code code = 1;
  string message = 2;
}

// Request for UpdateDeviceConfig.
message UpdateDeviceConfigRequest {
  string id = 1;
  DeviceConfig config = 2;
  DeviceConfigSection section = 3;
  UpdateOptions options = 4;

  // The universe the device belongs to.
  string universe = 5;
}

// Response for UpdateDeviceConfig.
message UpdateDeviceConfigResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Request for GetRecommendedWifi.
message GetRecommendedWifiRequest {
  // The universe the device belongs to.
  string universe = 1;
}

// Response for GetRecommendedWifi.
message GetRecommendedWifiResponse {
  repeated RecommendedWifi recommendations = 1;
}

// Request for GetHostDefaultDeviceConfig.
message GetHostDefaultDeviceConfigRequest {
  string host_name = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for GetHostDefaultDeviceConfig.
message GetHostDefaultDeviceConfigResponse {
  DeviceConfig device_config = 1;
}

// Request for GetHostConfig.
message GetHostConfigRequest {
  string host_name = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for GetHostConfig.
message GetHostConfigResponse {
  HostConfig host_config = 1;
  HostConfigUiStatus ui_status = 2;
}

// Request for CheckHostWritePermission.
message CheckHostWritePermissionRequest {
  string host_name = 1;

  // The universe the host belongs to.
  string universe = 2;
}

// Response for CheckHostWritePermission.
message CheckHostWritePermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for CheckHostConfigPermission.
message CheckHostConfigPermissionRequest {
  string host_name = 1;

  // The universe the host belongs to.
  string universe = 2;
}

// Response for CheckHostConfigPermission.
message CheckHostConfigPermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for UpdateHostConfig.
message UpdateHostConfigRequest {
  string host_name = 1;
  HostConfig config = 2;
  HostConfigUpdateScope scope = 3;
  UpdateOptions options = 4;

  // The universe the device belongs to.
  string universe = 5;
}

// Response for UpdateHostConfig.
message UpdateHostConfigResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Request for UnlockHostProperties.
message UnlockHostPropertiesRequest {
  string host_name = 1;
  // The universe the host belongs to.
  string universe = 2;
}

// Response for UnlockHostProperties.
message UnlockHostPropertiesResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Scope of the dimension in device config.
enum DimensionScope {
  DIMENSION_SCOPE_UNSPECIFIED = 0;
  // Stored in composite_dimension.supported_dimension
  SUPPORTED = 1;
  // Stored in composite_dimension.required_dimension
  REQUIRED = 2;
}

// Metadata for a configurable dimension.
message ConfigurableDimension {
  // Dimension key (e.g. "recovery", "pool", "skip_suw_app").
  string key = 1;

  // Human-readable display label.
  string display_name = 2;

  // Target storage section in composite_dimension.
  DimensionScope scope = 3;

  // Number of devices currently configured with this dimension in Config
  // Server. Populated in 1P internal builds; omitted in ATS builds.
  optional int32 configured_device_count = 4;
}

// Request for GetConfigurableDimensions.
message GetConfigurableDimensionsRequest {
  // Optional search query to filter dimensions by name (used in the "More..."
  // dialog). When empty, returns the top configured dimensions for the
  // selection toolbar dropdown.
  string query = 1;
}

// Response for GetConfigurableDimensions.
message GetConfigurableDimensionsResponse {
  // Configurable dimensions matching the request.
  repeated ConfigurableDimension dimensions = 1;

  // Whether operators are permitted to specify custom dimension keys.
  // Strictly false in ATS and OSS builds; true in 1P internal builds.
  bool allow_custom_dimensions = 2;
}

// Request for GetBatchDimensionContext.
message GetBatchDimensionContextRequest {
  // Explicit device IDs to retrieve context for.
  repeated string device_ids = 1;

  // The dimension key being inspected (e.g. "recovery", "pool").
  string key = 2;
}

// Response for GetBatchDimensionContext.
message GetBatchDimensionContextResponse {
  // Current values and authorization for a target device.
  message DeviceCurrent {
    string device_id = 1;
    // Current value set assigned to this dimension (empty if unset).
    repeated string values = 2;
    // Whether the caller is authorized to modify this device.
    bool writable = 3;
    // Human-readable reason when writable is false (e.g. host-managed, Config
    // Pusher, no permission).
    string unwritable_reason = 4;
  }

  // A candidate value set available to pick from in Step 1.
  message CandidateValue {
    // Value set (empty list represents clearing the dimension).
    repeated string values = 1;
    // Approximate number of devices in the fleet using this value set.
    int32 device_count = 2;
  }

  // Current values for the selected devices (Step 2 review table).
  repeated DeviceCurrent current = 1;

  // Candidate values ranked by popularity (Step 1 picker).
  repeated CandidateValue candidate_values = 2;
}

// Request for GetBatchWifiContext.
message GetBatchWifiContextRequest {
  // Explicit device IDs to retrieve context for.
  repeated string device_ids = 1;
}

// Response for GetBatchWifiContext.
message GetBatchWifiContextResponse {
  // Current Wi-Fi configuration and authorization for a target device.
  message DeviceCurrentWifi {
    string device_id = 1;
    // Current Wi-Fi configuration (empty SSID if unconfigured).
    WifiConfig wifi = 2;
    // Whether the caller is authorized to modify this device.
    bool writable = 3;
    // Human-readable reason when writable is false (e.g. host-managed, Config
    // Pusher, no permission).
    string unwritable_reason = 4;
  }

  // A candidate Wi-Fi network available to pick from in Step 1.
  message CandidateWifi {
    // Network name (SSID).
    string ssid = 1;
    // True if the network is hidden (does not broadcast SSID).
    bool scan_ssid = 2;
    // Approximate number of devices in the fleet configured with this network.
    int32 device_count = 3;
  }

  // Current Wi-Fi configurations for the selected devices (Step 2 review
  // table).
  repeated DeviceCurrentWifi current = 1;

  // Candidate Wi-Fi networks ranked by popularity (Step 1 picker).
  repeated CandidateWifi candidate_wifis = 2;
}

// Target dimension configuration to update across devices.
message DimensionUpdate {
  // Dimension key (e.g. "recovery", "pool", "skip_suw_app").
  string key = 1;

  // Target value set to assign to this dimension on all target devices.
  // Supplying an empty list removes this dimension key from target devices.
  repeated string values = 2;

  // Whether this is written to supported or required dimensions.
  DimensionScope scope = 3;
}

// Request for BatchUpdateDeviceConfig.
message BatchUpdateDeviceConfigRequest {
  // Target device IDs to update.
  repeated string device_ids = 1;

  // The specific configuration change to apply.
  oneof update {
    WifiConfig wifi = 2;
    DimensionUpdate dimension = 3;
  }
}

// Response for BatchUpdateDeviceConfig.
message BatchUpdateDeviceConfigResponse {
  // Per-device error details for devices that failed.
  // Key is device_id. An empty map indicates complete success.
  map<string, UpdateError> errors = 1;
}
