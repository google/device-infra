syntax = "proto3";

package devtools.mobileharness.fe.v6.service.proto.config;

import "google/api/annotations.proto";
import "src/devtools/mobileharness/fe/v6/service/proto/config/config_resources.proto";

option java_package = "com.google.devtools.mobileharness.fe.v6.service.proto.config";
option java_multiple_files = true;
option java_outer_classname = "ConfigServiceProto";

// Service definition for configuration management operations.
service ConfigService {
  // Retrieves the configuration for a specific device.
  rpc GetDeviceConfig(GetDeviceConfigRequest)
      returns (GetDeviceConfigResponse) {
    option (google.api.http) = {
      get: "/v6/devices/{id}/config"
    };
  }

  // Checks if the current user has permission to modify device configuration.
  //
  // Deprecated: use CheckDeviceConfigPermission instead.
  rpc CheckDeviceWritePermission(CheckDeviceWritePermissionRequest)
      returns (CheckDeviceWritePermissionResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:checkWritePermission",
      body: "*"
    };
    option deprecated = true;
  }

  // Checks if the current user has permission to modify device configuration.
  rpc CheckDeviceConfigPermission(CheckDeviceConfigPermissionRequest)
      returns (CheckDeviceConfigPermissionResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:checkConfigPermission",
      body: "*"
    };
  }

  // Updates the configuration for a specific device.
  rpc UpdateDeviceConfig(UpdateDeviceConfigRequest)
      returns (UpdateDeviceConfigResponse) {
    option (google.api.http) = {
      post: "/v6/devices/{id}/config:update",
      body: "*"
    };
  }

  // Retrieves a list of recommended Wi-Fi networks.
  rpc GetRecommendedWifi(GetRecommendedWifiRequest)
      returns (GetRecommendedWifiResponse) {
    option (google.api.http) = {
      get: "/v6/configs/wifi/recommendations"
    };
  }

  // Retrieves the default DeviceConfig set at the host level.
  rpc GetHostDefaultDeviceConfig(GetHostDefaultDeviceConfigRequest)
      returns (GetHostDefaultDeviceConfigResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}:getDefaultDeviceConfig",
      body: "*"
    };
  }

  // Retrieves the configuration and UI control status for a specific host.
  rpc GetHostConfig(GetHostConfigRequest) returns (GetHostConfigResponse) {
    option (google.api.http) = {
      get: "/v6/hosts/{host_name}/config"
    };
  }

  // Checks if the current user has permission to modify host configuration.
  //
  // Deprecated: use CheckHostConfigPermission instead.
  rpc CheckHostWritePermission(CheckHostWritePermissionRequest)
      returns (CheckHostWritePermissionResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:checkWritePermission",
      body: "*"
    };
    option deprecated = true;
  }

  // Checks if the current user has permission to modify host configuration.
  rpc CheckHostConfigPermission(CheckHostConfigPermissionRequest)
      returns (CheckHostConfigPermissionResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:checkConfigPermission",
      body: "*"
    };
  }

  // Updates the configuration for a specific host.
  rpc UpdateHostConfig(UpdateHostConfigRequest)
      returns (UpdateHostConfigResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:update",
      body: "*"
    };
  }

  // Unlocks the host properties by disabling Config Pusher management.
  rpc UnlockHostProperties(UnlockHostPropertiesRequest)
      returns (UnlockHostPropertiesResponse) {
    option (google.api.http) = {
      post: "/v6/hosts/{host_name}/config:unlockHostProperties",
      body: "*"
    };
  }

  // Retrieves curated dimensions available for batch configuration in the
  // selection toolbar.
  rpc GetConfigurableDimensions(GetConfigurableDimensionsRequest)
      returns (GetConfigurableDimensionsResponse) {
    option (google.api.http) = {
      get: "/v6/configs/dimensions:configurable"
    };
  }

  // Retrieves existing configurable dimension keys from DeviceConfig (for the
  // selected devices and across the fleet) along with the system-detected
  // dimension blocklist for Step 1 of custom dimension configuration.
  rpc BatchGetConfigurableDimensionKeys(
      BatchGetConfigurableDimensionKeysRequest)
      returns (BatchGetConfigurableDimensionKeysResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchGetConfigurableDimensionKeys"
      body: "*"
    };
  }

  // Retrieves fleet-wide candidate value-sets for a specific (dimension_name,
  // required) target.
  rpc GetDimensionValueSuggestions(GetDimensionValueSuggestionsRequest)
      returns (GetDimensionValueSuggestionsResponse) {
    option (google.api.http) = {
      get: "/v6/configs/dimensions:valueSuggestions"
    };
  }

  // Retrieves current values and writability for the selected devices under a
  // specific (dimension_name, required) target.
  rpc BatchGetDeviceDimensionConfigs(BatchGetDeviceDimensionConfigsRequest)
      returns (BatchGetDeviceDimensionConfigsResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchGetDimensionConfigs"
      body: "*"
    };
  }

  // Replaces the value-set for a specific (dimension_name, required) target
  // across the selected devices.
  rpc BatchUpdateDeviceDimensionConfigs(
      BatchUpdateDeviceDimensionConfigsRequest)
      returns (BatchUpdateDeviceDimensionConfigsResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchUpdateDimensionConfigs"
      body: "*"
    };
  }

  // Retrieves fleet-wide candidate Wi-Fi networks ranked by device_count.
  rpc GetWifiSuggestions(GetWifiSuggestionsRequest)
      returns (GetWifiSuggestionsResponse) {
    option (google.api.http) = {
      get: "/v6/configs/wifi:suggestions"
    };
  }

  // Retrieves current Wi-Fi configurations and writability for the selected
  // devices.
  rpc BatchGetDeviceWifiConfigs(BatchGetDeviceWifiConfigsRequest)
      returns (BatchGetDeviceWifiConfigsResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchGetWifiConfigs"
      body: "*"
    };
  }

  // Updates the default Wi-Fi configuration across the selected devices.
  rpc BatchUpdateDeviceWifiConfigs(BatchUpdateDeviceWifiConfigsRequest)
      returns (BatchUpdateDeviceWifiConfigsResponse) {
    option (google.api.http) = {
      post: "/v6/devices:batchUpdateWifiConfigs"
      body: "*"
    };
  }
}

// Request for GetDeviceConfig.
message GetDeviceConfigRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;

  // The host name of the lab the device connects to.
  string host_name = 3;
}

// Response for GetDeviceConfig.
message GetDeviceConfigResponse {
  DeviceConfig device_config = 1;
  bool is_host_managed = 2;
  string host_name = 3;
  DeviceConfigUiStatus ui_status = 4;
}

// Request for CheckDeviceWritePermission.
message CheckDeviceWritePermissionRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for CheckDeviceWritePermission.
message CheckDeviceWritePermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for CheckDeviceConfigPermission.
message CheckDeviceConfigPermissionRequest {
  string id = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for CheckDeviceConfigPermission.
message CheckDeviceConfigPermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Error details for update operations.
message UpdateError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    SELF_LOCKOUT_DETECTED = 1;
    PERMISSION_DENIED = 2;
    VALIDATION_ERROR = 3;
    UNKNOWN = 4;
  }
  Code code = 1;
  string message = 2;
}

// Request for UpdateDeviceConfig.
message UpdateDeviceConfigRequest {
  string id = 1;
  DeviceConfig config = 2;
  DeviceConfigSection section = 3;
  UpdateOptions options = 4;

  // The universe the device belongs to.
  string universe = 5;
}

// Response for UpdateDeviceConfig.
message UpdateDeviceConfigResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Request for GetRecommendedWifi.
message GetRecommendedWifiRequest {
  // The universe the device belongs to.
  string universe = 1;
}

// Response for GetRecommendedWifi.
message GetRecommendedWifiResponse {
  repeated RecommendedWifi recommendations = 1;
}

// Request for GetHostDefaultDeviceConfig.
message GetHostDefaultDeviceConfigRequest {
  string host_name = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for GetHostDefaultDeviceConfig.
message GetHostDefaultDeviceConfigResponse {
  DeviceConfig device_config = 1;
}

// Request for GetHostConfig.
message GetHostConfigRequest {
  string host_name = 1;

  // The universe the device belongs to.
  string universe = 2;
}

// Response for GetHostConfig.
message GetHostConfigResponse {
  HostConfig host_config = 1;
  HostConfigUiStatus ui_status = 2;
}

// Request for CheckHostWritePermission.
message CheckHostWritePermissionRequest {
  string host_name = 1;

  // The universe the host belongs to.
  string universe = 2;
}

// Response for CheckHostWritePermission.
message CheckHostWritePermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for CheckHostConfigPermission.
message CheckHostConfigPermissionRequest {
  string host_name = 1;

  // The universe the host belongs to.
  string universe = 2;
}

// Response for CheckHostConfigPermission.
message CheckHostConfigPermissionResponse {
  bool has_permission = 1;
  string user_name = 2;
}

// Request for UpdateHostConfig.
message UpdateHostConfigRequest {
  string host_name = 1;
  HostConfig config = 2;
  HostConfigUpdateScope scope = 3;
  UpdateOptions options = 4;

  // The universe the device belongs to.
  string universe = 5;
}

// Response for UpdateHostConfig.
message UpdateHostConfigResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Request for UnlockHostProperties.
message UnlockHostPropertiesRequest {
  string host_name = 1;
  // The universe the host belongs to.
  string universe = 2;
}

// Response for UnlockHostProperties.
message UnlockHostPropertiesResponse {
  bool success = 1;
  UpdateError error = 2;
}

// Metadata for a configurable dimension in the selection toolbar.
message ConfigurableDimension {
  // Dimension name in DeviceConfig (e.g. "recovery", "skip_suw_app", "pool",
  // "persist_test_harness").
  string dimension_name = 1;

  // Exact label shown in the toolbar menu and dialog header ("<dimension_name>"
  // when required=false; "Required Dimension: <dimension_name>" when
  // required=true).
  string display_name = 2;

  // True if this target configures composite_dimension.required_dimension;
  // false if it configures composite_dimension.supported_dimension.
  bool required = 3;
}

// Request for GetConfigurableDimensions.
message GetConfigurableDimensionsRequest {}

// Response for GetConfigurableDimensions.
message GetConfigurableDimensionsResponse {
  // Curated dimensions available for batch configuration.
  repeated ConfigurableDimension dimensions = 1;

  // Whether operators are permitted to configure custom dimensions.
  // Strictly false in ATS and OSS builds; true in 1P internal builds.
  bool allow_custom_dimensions = 2;
}

// Request for BatchGetConfigurableDimensionKeys.
message BatchGetConfigurableDimensionKeysRequest {
  // Explicit device IDs selected by the operator.
  repeated string device_ids = 1;

  // True to inspect composite_dimension.required_dimension;
  // false to inspect composite_dimension.supported_dimension.
  bool required = 2;
}

// Response for BatchGetConfigurableDimensionKeys.
message BatchGetConfigurableDimensionKeysResponse {
  // A configurable dimension key present in DeviceConfig (excluding
  // OmniLab system-detected dimensions).
  message CandidateDimensionKey {
    // Dimension key name in DeviceConfig (e.g. "pool", "label", "cluster").
    string dimension_name = 1;

    // Number of selected devices (from request.device_ids) that currently
    // have this dimension_name configured in the target scope
    // (required_dimension when required=true; supported_dimension when
    // required=false).
    int32 selected_device_count = 2;

    // Total number of devices across the fleet that have this
    // dimension_name configured in DeviceConfig in the target scope.
    int32 fleet_device_count = 3;
  }

  // Candidate configurable dimension keys ranked with keys present on the
  // selected devices first (by selected_device_count descending, then
  // fleet_device_count descending), followed by fleet-wide keys (by
  // fleet_device_count descending).
  repeated CandidateDimensionKey candidate_keys = 1;

  // Dimension key names automatically detected by OmniLab detectors and
  // system properties (e.g. "model", "sdk_version", "battery_level").
  // Operators are not permitted to configure these keys manually.
  repeated string system_dimension_names = 2;
}

// Request for GetDimensionValueSuggestions.
message GetDimensionValueSuggestionsRequest {
  // Dimension name in DeviceConfig (e.g. "recovery", "skip_suw_app", "pool").
  string dimension_name = 1;

  // True to query candidate value-sets from required_dimension;
  // false to query candidate value-sets from supported_dimension.
  bool required = 2;
}

// Response for GetDimensionValueSuggestions.
message GetDimensionValueSuggestionsResponse {
  // A distinct value-set available as a one-click suggestion in Step 1.
  message CandidateValue {
    // Complete value-set configured for this (dimension_name, required) target.
    repeated string values = 1;
    // Total number of devices across all devices configured with this exact
    // value-set.
    int32 device_count = 2;
  }

  // Candidate value-sets ranked by device_count descending.
  repeated CandidateValue candidate_values = 1;
}

// Request for BatchGetDeviceDimensionConfigs.
message BatchGetDeviceDimensionConfigsRequest {
  // Explicit device IDs selected by the operator.
  repeated string device_ids = 1;

  // Dimension name being configured.
  string dimension_name = 2;

  // True to inspect composite_dimension.required_dimension;
  // false to inspect composite_dimension.supported_dimension.
  bool required = 3;
}

// Response for BatchGetDeviceDimensionConfigs.
message BatchGetDeviceDimensionConfigsResponse {
  // Current value-set and writability for a single selected device.
  message DeviceDimensionCurrent {
    string device_id = 1;
    // Current value-set configured for (dimension_name, required) in
    // DeviceConfig (empty list if not set).
    repeated string values = 2;
    // Whether this device's configuration can be modified. Always true in ATS.
    bool writable = 3;
    // Explanation when writable is false (e.g. host-managed shared config,
    // Config Pusher, no permission).
    string unwritable_reason = 4;
  }

  repeated DeviceDimensionCurrent devices = 1;
}

// Request for BatchUpdateDeviceDimensionConfigs.
message BatchUpdateDeviceDimensionConfigsRequest {
  // Target device IDs to update.
  repeated string device_ids = 1;

  // Dimension name in DeviceConfig (e.g. "recovery", "skip_suw_app", "pool").
  string dimension_name = 2;

  // Complete target value-set to assign to this (dimension_name, required)
  // target on all selected devices. An empty list [] removes this
  // dimension_name from the target list (supported_dimension or
  // required_dimension).
  repeated string values = 3;

  // When false, only reads/replaces entries with name == dimension_name in
  // composite_dimension.supported_dimension. When true, only reads/replaces
  // entries with name == dimension_name in
  // composite_dimension.required_dimension. Never modifies the other list.
  bool required = 4;
}

// Response for BatchUpdateDeviceDimensionConfigs.
message BatchUpdateDeviceDimensionConfigsResponse {
  // Per-device error details for devices that failed to update.
  // Key is device_id. An empty map indicates all target devices succeeded.
  map<string, UpdateError> errors = 1;
}

// Request for GetWifiSuggestions.
message GetWifiSuggestionsRequest {}

// Response for GetWifiSuggestions.
message GetWifiSuggestionsResponse {
  // Indicates the network comes from the curated credential store (1P),
  // where fleet-wide device counts do not apply.
  message CuratedPreset {}

  // Indicates the network is aggregated from active device configurations
  // in the fleet (ATS), carrying the fleet usage count.
  message FleetInUse {
    int32 device_count = 1;
  }

  // A candidate Wi-Fi network available to pick from in Step 1.
  message CandidateWifi {
    // Network name (SSID).
    string ssid = 1;
    // Password (PSK) for the network.
    string psk = 2;
    // True if the network is hidden (does not broadcast SSID).
    bool scan_ssid = 3;

    // Origin of this Wi-Fi suggestion.
    oneof source {
      CuratedPreset curated_preset = 4;
      FleetInUse fleet_in_use = 5;
    }
  }

  // Candidate Wi-Fi networks (curated_preset entries in 1P; fleet_in_use
  // entries ranked by device_count descending in ATS).
  repeated CandidateWifi candidate_wifis = 1;
}

// Request for BatchGetDeviceWifiConfigs.
message BatchGetDeviceWifiConfigsRequest {
  // Explicit device IDs selected by the operator.
  repeated string device_ids = 1;
}

// Response for BatchGetDeviceWifiConfigs.
message BatchGetDeviceWifiConfigsResponse {
  // Current Wi-Fi configuration and writability for a single selected device.
  message DeviceWifiCurrent {
    string device_id = 1;
    // Current Wi-Fi configuration (empty ssid if unconfigured). Includes ssid,
    // psk, scan_ssid.
    WifiConfig wifi = 2;
    // Whether this device's configuration can be modified. Always true in ATS.
    bool writable = 3;
    // Explanation when writable is false (e.g. host-managed shared config,
    // Config Pusher, no permission).
    string unwritable_reason = 4;
  }

  repeated DeviceWifiCurrent devices = 1;
}

// Request for BatchUpdateDeviceWifiConfigs.
message BatchUpdateDeviceWifiConfigsRequest {
  // Target device IDs to update.
  repeated string device_ids = 1;

  // Target Wi-Fi configuration to apply (empty ssid clears default_wifi).
  WifiConfig wifi = 2;
}

// Response for BatchUpdateDeviceWifiConfigs.
message BatchUpdateDeviceWifiConfigsResponse {
  // Per-device error details for devices that failed to update.
  // Key is device_id. An empty map indicates all target devices succeeded.
  map<string, UpdateError> errors = 1;
}
