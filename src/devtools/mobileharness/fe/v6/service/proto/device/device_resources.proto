syntax = "proto3";

package devtools.mobileharness.fe.v6.service.proto.device;

import "google/protobuf/timestamp.proto";
import "src/devtools/mobileharness/fe/v6/service/proto/common/common_resources.proto";

option java_package = "com.google.devtools.mobileharness.fe.v6.service.proto.device";
option java_multiple_files = true;
option java_outer_classname = "DeviceResourcesProto";

// Represents the comprehensive data required to render the "Overview" tab
// on the Device Detail Page.
message DeviceOverview {
  // The unique identifier of the device.
  string id = 1;

  // Information about the host machine this device is connected to.
  HostInfo host = 2;

  // Detailed information about the device's current health, activity, and
  // status.
  HealthAndActivityInfo health_and_activity = 3;

  // Core hardware and software specifications of the device.
  BasicDeviceInfo basic_info = 4;

  // Permissions defining who can own and execute tests on the device.
  common.PermissionInfo permissions = 5;

  // Lists of supported drivers and decorators for the device.
  CapabilitiesInfo capabilities = 6;

  // Device dimensions used for test scheduling, grouped by their source.
  Dimensions dimensions = 7;

  // Additional device properties, as a simple key-value map.
  map<string, string> properties = 8;

  // If the device is a testbed, this contains information about its
  // sub-devices.
  repeated SubDeviceInfo sub_devices = 9;

  // Whether the device is an Android device.
  bool is_android = 10;
}

// Device type information.
message DeviceType {
  // The type string.
  string type = 1;
  // Flag indicating if this type suggests an abnormal or unhealthy state.
  bool is_abnormal = 2;
}

// Information about the host machine.
message HostInfo {
  // The hostname of the lab server.
  string name = 1;
  // The IP address of the lab server.
  string ip = 2;
}

// Network connectivity details for a device.
message NetworkInfo {
  // WiFi signal strength in dBm, e.g., -65.
  sint32 wifi_rssi = 1;
  // Indicates if the device has internet access.
  bool has_internet = 2;
}

// Information about remote control capabilities and status.
message RemoteControlInfo {
  bool is_supported = 1;
  string unsupported_reason = 2;
}

// Transitional: superseded by `UiState ui_state` plus the `title` text.
//
// Retained during the frontend/backend release transition so a client on either
// side of a skew window still renders an icon. The backend keeps setting
// `HealthAndActivityInfo.state` (best-fit legacy value) alongside the new
// `ui_state`. Removed by a follow-up cleanup CL once both sides are rolled out.
enum HealthState {
  option deprecated = true;

  HEALTH_STATE_UNSPECIFIED = 0 [deprecated = true];
  IN_SERVICE_IDLE = 1 [deprecated = true];
  IN_SERVICE_BUSY = 2 [deprecated = true];
  OUT_OF_SERVICE_RECOVERING = 3 [deprecated = true];
  OUT_OF_SERVICE_TEMP_MAINT = 4 [deprecated = true];
  OUT_OF_SERVICE_NEEDS_FIXING = 5 [deprecated = true];
  UNKNOWN = 6 [deprecated = true];
  IDLE_BUT_QUARANTINED = 7 [deprecated = true];
}

// Presentation intent for the Health & Activity card.
//
// This is a pure presentation signal: the frontend maps each value to an
// icon/color/spin treatment. It intentionally carries no business semantics.
// The device's semantic health category (In Service, In Transition, Auto
// Recovery, Needs Manual Repair) is conveyed to the user through the `title`
// text, not as a wire enum, per the FE v6 BFF principle.
enum UiState {
  UI_STATE_UNSPECIFIED = 0;
  // Healthy and idle: solid success treatment.
  HEALTHY = 1;
  // Healthy and actively running a task: in-progress treatment.
  BUSY = 2;
  // Temporarily unavailable but expected to self-recover: transient treatment.
  TRANSITIONING = 3;
  // An automated recovery task is running: in-progress warning treatment.
  RECOVERING = 4;
  // Broken and needs a human: error treatment.
  ERROR = 5;
  // Healthy but manually withheld from tests (e.g. quarantined): blocked
  // treatment.
  BLOCKED = 6;
}

// Contains all data related to the device's health, status, and current
// activity.
message HealthAndActivityInfo {
  // The main title to display in the Health & Activity card.
  string title = 1;

  // A concise, human-readable explanation of the device's state.
  string subtitle = 2;

  // Transitional: use `ui_state` instead. Still populated by the backend during
  // the release transition so older frontends render an icon; a newer frontend
  // reads it only as a fallback when `ui_state` is unset (older backend).
  // Removed by a follow-up cleanup CL once both sides are rolled out.
  HealthState state = 3 [deprecated = true];

  // The raw device status from the underlying system.
  message DeviceStatus {
    // The status string, e.g., IDLE, BUSY, MISSING, FAILED, INIT, DIRTY.
    string status = 1;
    // Flag indicating if this raw status is considered critical.
    bool is_critical = 2;
  }
  DeviceStatus device_status = 4;

  repeated DeviceType device_types = 5;

  // The timestamp of when the device was last considered "In Service".
  google.protobuf.Timestamp last_in_service_time = 6;

  // Details of the current task if the device is BUSY.
  message CurrentTask {
    // Type of the running task, e.g., "Test", "Recovery Task".
    string type = 1;
    // The unique identifier for the task.
    string task_id = 2;
    // Optional Job ID if the task is part of a larger job.
    string job_id = 3;
  }
  CurrentTask current_task = 7;

  // Structured diagnostic information.
  message Diagnostics {
    // Text describing the primary diagnosis of the issue.
    string diagnosis = 1;
    // Text providing more context or explanation about the diagnosis.
    string explanation = 2;
    // Suggested steps the user can take to resolve the issue.
    string suggested_action = 3;
  }
  Diagnostics diagnostics = 8;

  // Presentation intent that tells the frontend how to render the card
  // (icon/color/spin). The semantic health category is conveyed via `title`.
  UiState ui_state = 9;
}

// Basic hardware, software, and real-time information about the device.
message BasicDeviceInfo {
  // Device model, e.g., "Pixel 8 Pro".
  string model = 1;
  // OS version, e.g., "14" for Android, "22.04" for Ubuntu.
  string version = 2;
  // Form factor of the device.
  enum Form {
    FORM_UNSPECIFIED = 0;
    PHYSICAL = 1;
    VIRTUAL = 2;
    TESTBED = 3;
    UNKNOWN = 4;
  }
  Form form = 3;
  // Operating system, e.g., "Android", "Ubuntu Linux".
  string os = 4;
  // Battery level percentage (0-100), or -1 if not applicable.
  int32 battery_level = 5;
  // Network connectivity details.
  NetworkInfo network = 6;
  // Hardware identifier, common for Android devices.
  string hardware = 7;
  // Build ID or version, common for Android devices.
  string build = 8;
  // URL to the monitoring dashboard, populated by the backend if applicable.
  string metrics_url = 9;
}

// Lists of supported test drivers and decorators.
message CapabilitiesInfo {
  // Test drivers compatible with this device.
  repeated string supported_drivers = 1;
  // Decorators that can be applied to tests running on this device.
  repeated string supported_decorators = 2;
}

// Represents a group of dimensions from a single source.
message DimensionSourceGroup {
  repeated common.DeviceDimension dimensions = 1;
}

// Device dimensions, categorized into 'supported' and 'required'.
message Dimensions {
  // Dimensions that describe the device's capabilities or attributes.
  map<string, DimensionSourceGroup> supported = 1;
  // Dimensions that a test job MUST specify to be allocated this device.
  map<string, DimensionSourceGroup> required = 2;
}

// Information about a sub-device in a testbed.
message SubDeviceInfo {
  string id = 1;
  repeated DeviceType types = 2;
  repeated common.DeviceDimension dimensions = 3;

  // Model of the sub-device.
  string model = 4;
  // Version of the sub-device.
  string version = 5;
  // Battery level percentage (0-100), or -1 if not applicable.
  int32 battery_level = 6;
  // Network connectivity details.
  NetworkInfo network = 7;
  // Remote control support details.
  RemoteControlInfo remote_control = 8;
}

// Testbed configuration in YAML format.
message TestbedConfig {
  string yaml_content = 1;
  string code_search_link = 2;
}

// Parameters for flash action button.
message FlashButtonParams {
  string device_type = 1;
  string required_dimensions = 2;
}

// State of flash action button.
message FlashActionInfo {
  common.ActionButtonState state = 1;
  FlashButtonParams params = 2;
}
// Quarantine information of device.
message QuarantineInfo {
  bool is_quarantined = 1;
  google.protobuf.Timestamp expiry = 2;
}

// Actions for device header.
message DeviceActions {
  common.ActionButtonState screenshot = 1;
  common.ActionButtonState logcat = 2;
  FlashActionInfo flash = 3;
  common.ActionButtonState remote_control = 4;
  common.ActionButtonState quarantine = 5;
  common.ActionButtonState configuration = 6;
  // used to decommission device from lab
  common.ActionButtonState decommission = 7;
  common.ActionButtonState prepare = 8;
}

// Information for device header.
message DeviceHeaderInfo {
  string id = 1;
  HostInfo host = 2;
  QuarantineInfo quarantine = 3;
  DeviceActions actions = 4;
}
