syntax = "proto3";

package devtools.mobileharness.fe.v6.service.proto.common;

import "google/protobuf/timestamp.proto";

option java_package = "com.google.devtools.mobileharness.fe.v6.service.proto.common";
option java_multiple_files = true;
option java_outer_classname = "CommonResourcesProto";

// Status and result enums shared across the v6 test/job/session protos.
//
// These follow "gRPC-friendly" enum conventions, which matter because gRPC
// uses proto3, where enum fields have no presence: an unset field is silently
// read as the zero value. The conventions below keep that safe and composable:
//
//  1. Each enum reserves 0 as an explicit `*_UNSPECIFIED` sentinel. Because an
//     unpopulated field decodes to 0, that 0 must mean "not set / unknown" and
//     never a real state. (Contrast the legacy api.model enums, where e.g.
//     TestStatus NEW = 0 makes "unset" indistinguishable from "genuinely new".)
//
//  2. Every value name is prefixed with the enum name (TEST_RESULT_PASS, not
//     PASS). Proto enum value names are scoped to the enclosing file, not the
//     enum, so unprefixed names would collide. The prefixes are exactly what
//     let all six enums live together in this one common file.
//
//  3. Status (lifecycle) and Result (outcome) are kept as separate enums, so a
//     RUNNING item simply has an UNSPECIFIED result until it finishes instead
//     of needing a fake "in progress" result value.
//
//  4. They are FE-owned (not reused from the internal execution-layer
//     api.model protos), so this public gRPC contract stays decoupled from
//     internal proto churn and build dependencies.

// gRPC-friendly status of a test, decoupled from its result.
enum TestStatus {
  TEST_STATUS_UNSPECIFIED = 0;
  TEST_STATUS_NEW = 1;
  TEST_STATUS_ASSIGNED = 2;
  TEST_STATUS_RUNNING = 3;
  TEST_STATUS_DONE = 4;
  TEST_STATUS_SUSPENDED = 5;
}

// gRPC-friendly result of a test.
enum TestResult {
  TEST_RESULT_UNSPECIFIED = 0;
  TEST_RESULT_PASS = 1;
  TEST_RESULT_FAIL = 2;
  TEST_RESULT_ERROR = 3;
  TEST_RESULT_TIMEOUT = 4;
  TEST_RESULT_ABORT = 5;
  TEST_RESULT_SKIP = 6;
}

// gRPC-friendly status of a job, decoupled from its result.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_NEW = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_DONE = 3;
  JOB_STATUS_SUSPENDED = 4;
  JOB_STATUS_ASSIGNED = 5;
}

// gRPC-friendly result of a job.
enum JobResult {
  JOB_RESULT_UNSPECIFIED = 0;
  JOB_RESULT_PASS = 1;
  JOB_RESULT_FAIL = 2;
  JOB_RESULT_ERROR = 3;
  JOB_RESULT_TIMEOUT = 4;
  JOB_RESULT_ABORT = 5;
  JOB_RESULT_SKIP = 6;
}

// gRPC-friendly status of a session, decoupled from its result.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_NEW = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_DONE = 3;
}

// gRPC-friendly result of a session.
enum SessionResult {
  SESSION_RESULT_UNSPECIFIED = 0;
  SESSION_RESULT_PASS = 1;
  SESSION_RESULT_FAIL = 2;
  SESSION_RESULT_ERROR = 3;
  SESSION_RESULT_TIMEOUT = 4;
  SESSION_RESULT_ABORT = 5;
  SESSION_RESULT_SKIP = 6;
}

// Information about user and group permissions.
message PermissionInfo {
  // List of users/groups who own the resource.
  repeated string owners = 1;
  // List of users/groups who can execute actions on the resource.
  repeated string executors = 2;
}

// Represents one dimension of a resource (e.g., device, host).
message DeviceDimension {
  string name = 1;
  string value = 2;
}

// State of an action button.
message ActionButtonState {
  bool enabled = 1;
  bool visible = 2;
  string tooltip = 3;
  bool is_ready = 4;
}

// Visual fill style shared by split bar segments, legend swatches, and bars.
enum TimelineFill {
  TIMELINE_FILL_UNSPECIFIED = 0;
  TIMELINE_FILL_WAIT = 1;
  TIMELINE_FILL_QUEUED = 2;
  TIMELINE_FILL_SETUP = 3;
  TIMELINE_FILL_RESOLVE = 4;
  TIMELINE_FILL_TEST = 5;
  TIMELINE_FILL_TEARDOWN = 6;
  TIMELINE_FILL_OPAQUE = 7;
  TIMELINE_FILL_UNRECORDED = 8;
  TIMELINE_FILL_UNKNOWN = 9;
  TIMELINE_FILL_MISSING = 10;
}

// Horizontal alignment for an axis tick label near the track edges.
enum TimelineTickAlignment {
  TIMELINE_TICK_ALIGNMENT_UNSPECIFIED = 0;
  TIMELINE_TICK_ALIGNMENT_CENTER = 1;
  TIMELINE_TICK_ALIGNMENT_START = 2;
  TIMELINE_TICK_ALIGNMENT_END = 3;
}

// Outcome tone for result chips, end markers, and sub-test bars.
enum TimelineResultTone {
  TIMELINE_RESULT_TONE_UNSPECIFIED = 0;
  TIMELINE_RESULT_TONE_PASS = 1;
  TIMELINE_RESULT_TONE_FAIL = 2;
  TIMELINE_RESULT_TONE_TIMEOUT = 3;
  TIMELINE_RESULT_TONE_NEUTRAL = 4;
}

// One tick mark on the shared relative time axis.
message TimelineAxisTick {
  double left_percent = 1;
  string label = 2;
  TimelineTickAlignment alignment = 3;
}

// Shared relative time axis for all rows in a timeline table.
message TimelineAxis {
  // Gridline spacing as a percentage of the full track width.
  double tick_step_percent = 1;
  repeated TimelineAxisTick ticks = 2;
}

// Key/value fact row shown inside a timeline hover tooltip.
message TimelineTooltipFact {
  string label = 1;
  string value = 2;
}

// One proportional segment of the top summary split bar and its legend entry.
message TimelineSplitSegment {
  // Links this segment and legend item to matching phase headers, step rows, or
  // job bars during hover focus.
  string focus_key = 1;
  string label = 2;
  TimelineFill fill = 3;
  // Duration in milliseconds used as the CSS flex-grow weight.
  double flex_weight = 4;
  string duration_text = 5;
  string share_text = 6;
  repeated TimelineTooltipFact tooltip_facts = 7;
  string tooltip_hint = 8;
}

// A positioned time interval bar on the shared axis, carrying exact timestamps
// so the frontend can format wall-clock times in the viewer's local timezone.
message TimelineIntervalBar {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double left_percent = 3;
  double width_percent = 4;
  string start_offset_text = 5;
  string end_offset_text = 6;
  string duration_text = 7;
}

// Nested sub-test timing row rendered under a test's driver row.
message TestTimelineSubTestRow {
  string name = 1;
  TimelineResultTone result_tone = 2;
  string result_label = 3;
  string duration_text = 4;
  TimelineIntervalBar bar = 5;
  string tooltip_detail = 6;
}

// Direct child step row inside a collapsible test phase.
message TestTimelineStepRow {
  string label = 1;
  // Secondary fact line under the label; empty when none applies.
  string detail = 2;
  string focus_key = 3;
  // Shared identifier linking a decorator's setup and teardown rows on hover;
  // empty for unpaired steps.
  string pair_key = 4;
  TimelineFill fill = 5;
  string duration_text = 6;
  string share_text = 7;
  repeated TimelineIntervalBar bars = 8;
  // True when a non-passing test stopped during this step.
  bool is_ended_step = 9;
  TimelineResultTone result_tone = 10;
  string result_label = 11;
  // Horizontal axis position (0 to 100) of the stopping end-mark when
  // is_ended_step is true.
  double end_mark_left_percent = 12;
  string error_message = 13;
  string full_error_message = 14;
  string tooltip_hint = 15;
  repeated TestTimelineSubTestRow sub_tests = 16;
}

// Collapsible phase header and its chronological child step rows.
message TestTimelinePhase {
  string phase_id = 1;
  string focus_key = 2;
  string label = 3;
  TimelineFill fill = 4;
  // Step count badge text (for example "4 steps"); empty when the phase has a
  // single step.
  string step_count_text = 5;
  double bracket_left_percent = 6;
  double bracket_width_percent = 7;
  string duration_text = 8;
  string share_text = 9;
  repeated TestTimelineStepRow rows = 10;
}

// Phase-grouped step timeline for a single test execution.
message TestTimeline {
  repeated TestTimelinePhase phases = 1;
}

// One contiguous job state interval in the top Job activity row.
message JobActivityBar {
  string focus_key = 1;
  string label = 2;
  TimelineFill fill = 3;
  TimelineIntervalBar interval = 4;
  string share_text = 5;
}

// One bar inside the Job setup row (queued, preparing, or file resolving).
message JobSetupBar {
  string focus_key = 1;
  string label = 2;
  string detail = 3;
  TimelineFill fill = 4;
  // True when rendered as an inset sub-bar inside a parent bar (file resolving
  // inside job pre-run).
  bool is_inner = 5;
  TimelineIntervalBar interval = 6;
  string share_text = 7;
}

// Job-level queue and pre-run setup row before device allocation.
message JobSetupRow {
  string detail = 1;
  string duration_text = 2;
  repeated JobSetupBar bars = 3;
}

// Positioned bar segment inside a child test lane on the Job timeline.
message JobLaneBar {
  string focus_key = 1;
  TimelineFill fill = 2;
  double left_percent = 3;
  double width_percent = 4;
}

// Recorded run duration for a child test lane.
message JobLaneRunRecorded {
  string duration_text = 1;
}

// Unrecorded run state for a child test lane ("Not started" or "Unknown").
message JobLaneRunUnrecorded {
  string reason = 1;
}

// Display value for the Ran column of a child test lane.
message JobLaneRunCell {
  oneof state {
    JobLaneRunRecorded recorded = 1;
    JobLaneRunUnrecorded unrecorded = 2;
  }
}

// One child test run lane on the Job timeline.
message JobTestLane {
  string test_id = 1;
  string display_name = 2;
  string full_name = 3;
  // True when MOSS returned a TestDetail record for this test; false when only
  // the job's DEVICE_ALLOCATION entry exists.
  bool has_record = 4;
  // Disambiguation badge for repeated test names ("#1", "#2", or "Retry");
  // empty for single runs.
  string run_tag = 5;
  repeated string device_ids = 6;
  TimelineResultTone result_tone = 7;
  string result_label = 8;
  // Formatted pre-run wait duration (device allocation or pre-start wait);
  // empty when no wait was recorded.
  string waited_text = 9;
  JobLaneRunCell ran_cell = 10;
  repeated JobLaneBar bars = 11;
  bool has_end_mark = 12;
  double end_mark_left_percent = 13;
  repeated TimelineTooltipFact tooltip_rows = 14;
  string overhead_hint = 15;
  string missing_record_hint = 16;
}

// State activity breakdown and per-test lanes for a job execution.
message JobTimeline {
  string total_duration_text = 1;
  repeated JobActivityBar activity_bars = 2;
  JobSetupRow job_setup = 3;
  repeated JobTestLane lanes = 4;
}

// Pre-computed display model for the Test Detail and Job Detail Timeline tabs.
message TimeBreakdown {
  repeated string summary_lines = 1;
  google.protobuf.Timestamp origin_time = 2;
  google.protobuf.Timestamp finish_time = 3;
  TimelineAxis axis = 4;
  repeated TimelineSplitSegment split_segments = 5;

  oneof content {
    TestTimeline test_timeline = 6;
    JobTimeline job_timeline = 7;
  }
}

// Representing a single error with its trace.
message ErrorInfo {
  string message = 1;
  string trace = 2;
}

// Representing a single warning trace log.
message WarningInfo {
  string message = 1;
  string trace = 2;
}

message Errors {
  repeated ErrorInfo error = 1;
}

message Warnings {
  repeated WarningInfo warning = 1;
}

// Troubleshooting details (warnings & errors).
message Troubleshooting {
  Warnings warnings = 1;
  Errors result_cause = 2;
}

// Shared execution details.
message ExecutionDetails {
  string user = 1;
  string actual_user = 2;
  string cloud_log_link = 3;

  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  google.protobuf.Timestamp update_time = 7;
}
