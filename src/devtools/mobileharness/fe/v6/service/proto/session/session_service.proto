syntax = "proto3";

package devtools.mobileharness.fe.v6.service.proto.session;

import "google/api/annotations.proto";
import "src/devtools/mobileharness/fe/v6/service/proto/session/session_resources.proto";

option java_package = "com.google.devtools.mobileharness.fe.v6.service.proto.session";
option java_multiple_files = true;
option java_outer_classname = "SessionServiceProto";

service SessionService {
  // Retrieves the detailed Session overview by its ID. Session is a top-level
  // resource, so the path is flat: /v6/sessions/{session_id}.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {
      get: "/v6/sessions/{session_id}"
    };
  }

  // Gets the whole log of a session by its ID.
  //
  // Unlike a job or a test, a session log is not tailed: the console reads it
  // once when the Session Log tab is opened. It is also not stored on the
  // session itself, it is a file in the session's CNS directory.
  rpc GetSessionLog(GetSessionLogRequest) returns (GetSessionLogResponse) {
    option (google.api.http) = {
      get: "/v6/sessions/{session_id}/log"
    };
  }

  // Retrieves the content of a specific file associated with a Session.
  //
  // Non-path fields (file_path) are automatically mapped to query parameters
  // by the gRPC-JSON transcoder.
  rpc GetSessionFile(GetSessionFileRequest) returns (GetSessionFileResponse) {
    option (google.api.http) = {
      get: "/v6/sessions/{session_id}/file"
    };
  }
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  SessionDetail session = 1;
}

message GetSessionLogRequest {
  // The ID of the session whose log to retrieve.
  string session_id = 1;

  // Held for the incremental-read fields (offset, content_hash) that job and
  // test logs use for tailing.
  reserved 2, 3;
}

message GetSessionLogResponse {
  // The session's whole log. Empty if the session recorded no log file.
  string log_content = 1;

  // Held for the tailing fields (next_offset, session_status, log_reset,
  // content_hash) that job and test logs use. The session's status comes from
  // GetSession, which the Session Detail page loads anyway.
  reserved 2 to 5;
}

message GetSessionFileRequest {
  string session_id = 1;
  string file_path = 2;
}

message GetSessionFileResponse {
  string content = 1;
}
