syntax = "proto2";

package mobileharness.shared.spec;

import "src/java/com/google/wireless/qa/mobileharness/shared/proto/spec/base_spec.proto";

option java_package = "com.google.wireless.qa.mobileharness.shared.proto.spec.decorator";
option java_multiple_files = true;
option java_outer_classname = "AndroidDumpSysDecoratorSpecOuterClass";

// Specs for AndroidDumpSysDecorator.
message AndroidDumpSysDecoratorSpec {
  extend DecoratorSpec {
    optional AndroidDumpSysDecoratorSpec ext = 1030;
  }

  optional bool log_to_file = 1 [
    default = false,
    (field_detail) = {
      help: "If set to true, saves the dumpsys log in a file and sends it back "
            "to the client or test result service. Otherwise, merges the "
            "dumpsys log into the test log."
    }
  ];

  optional bool dumpsys_on_pass = 2 [
    default = true,
    (field_detail) = {
      help: "Whether to run this decorator when a test passes. Default value "
            "is true."
    }
  ];

  optional string dumpsys_log_file_name = 3 [
    default = "dumpsys.log",
    (field_detail) = {
      help: "Comma-separated list of file names used when saving dumpsys logs "
            "to files. Defaults to dumpsys.log."
    }
  ];

  optional string dumpsys_type = 4 [
    default = "activity",
    (field_detail) = {
      help: "Comma-separated list of dumpsys service types to run as "
            "'dumpsys <dumpsys_type> <dumpsys_suffix>'. Defaults to "
            "'activity'. Set to 'none' to get diagnostic output for all "
            "system services."
    }
  ];

  optional string dumpsys_suffix = 5 [
    default = "all",
    (field_detail) = {
      help: "Comma-separated list of dumpsys arguments to run as "
            "'dumpsys <dumpsys_type> <dumpsys_suffix>'. Defaults to 'all'. "
            "Ignored when dumpsys_type is 'none' or 'all'."
    }
  ];
}
