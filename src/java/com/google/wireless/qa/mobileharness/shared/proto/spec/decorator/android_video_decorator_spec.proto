syntax = "proto2";

package mobileharness.shared.spec;

import "src/java/com/google/wireless/qa/mobileharness/shared/proto/spec/base_spec.proto";

option java_package = "com.google.wireless.qa.mobileharness.shared.proto.spec.decorator";
option java_multiple_files = true;
option java_outer_classname = "AndroidVideoDecoratorSpecProto";

message AndroidVideoDecoratorSpec {
  extend DecoratorSpec {
    optional AndroidVideoDecoratorSpec ext = 1028;
  }

  message AutoDetect {}

  message StitchedScreenshots {}

  message HdScreenRecord {
    optional int32 bit_rate = 1;
    optional string resolution = 2;
    optional int32 fps = 3;
  }

  message EmulatorConsole {
    optional int32 bit_rate = 1;
    optional string resolution = 2;
    optional int32 fps = 3;
  }

  message Videocat {
    optional int32 bit_rate = 1;
    optional string resolution = 2;
    optional int32 fps = 3;
  }

  // If not set, defaults to auto_detect (which selects best recorder based on
  // device).
  oneof video_type_spec {
    AutoDetect auto_detect = 1;
    StitchedScreenshots stitched_screenshots = 2;
    HdScreenRecord hd_screen_record = 3;
    EmulatorConsole emulator_console = 4;
    Videocat videocat = 5;
  }

  optional bool video_on_pass = 6 [default = true];
}
