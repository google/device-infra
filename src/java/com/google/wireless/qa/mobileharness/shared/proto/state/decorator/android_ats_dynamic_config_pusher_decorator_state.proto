syntax = "proto3";

package mobileharness.shared.state;

option java_package = "com.google.wireless.qa.mobileharness.shared.proto.state.decorator";
option java_multiple_files = true;

// Runtime state for AndroidAtsDynamicConfigPusherDecorator.
message AndroidAtsDynamicConfigPusherDecoratorState {
  optional string device_file_pushed_path = 1;
  optional string content_provider = 2;
}
