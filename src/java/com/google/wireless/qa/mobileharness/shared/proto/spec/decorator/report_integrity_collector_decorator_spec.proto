syntax = "proto2";

package mobileharness.shared.spec;

import "src/java/com/google/wireless/qa/mobileharness/shared/proto/spec/base_spec.proto";

option java_package = "com.google.wireless.qa.mobileharness.shared.proto.spec.decorator";
option java_multiple_files = true;
option java_outer_classname = "ReportIntegrityCollectorDecoratorSpecProto";

// Specs for ReportIntegrityCollectorDecorator.
message ReportIntegrityCollectorDecoratorSpec {
  extend DecoratorSpec {
    optional ReportIntegrityCollectorDecoratorSpec ext = 1029;
  }

  // The APK file name to instrument (e.g., "ReportIntegrityInfo.apk").
  optional string apk = 1
      [(field_detail) = { help: "Name of the apk to instrument" }];

  // The package name of the APK.
  optional string package_name = 2
      [(field_detail) = { help: "Name of the package" }];

  // The path to the xTS test directory containing the APK. It is set by the
  // job creator at runtime instead of being statically configured.
  optional string xts_test_dir = 3
      [(field_detail) = { help: "The xts test dir which contains the APK." }];

  // The directory on device which the APK writes the device info files to.
  optional string src_dir = 4 [
    default = "/sdcard/device-info-files/",
    (field_detail) = {
      help: "The directory on device to pull the device info files from"
    }
  ];
}
