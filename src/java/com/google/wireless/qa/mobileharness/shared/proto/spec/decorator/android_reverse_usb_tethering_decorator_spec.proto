syntax = "proto2";

package mobileharness.shared.spec;

import "src/java/com/google/wireless/qa/mobileharness/shared/proto/spec/base_spec.proto";

option java_package = "com.google.wireless.qa.mobileharness.shared.proto.spec.decorator";
option java_multiple_files = true;
option java_outer_classname = "AndroidReverseUsbTetheringDecoratorSpecOuterClass";

// Specs for AndroidReverseUsbTetheringDecorator.
message AndroidReverseUsbTetheringDecoratorSpec {
  extend DecoratorSpec {
    optional AndroidReverseUsbTetheringDecoratorSpec ext = 1031;
  }

  optional bool persist_across_reboot = 1 [
    default = true,
    (field_detail) = {
      help: "Whether to persist USB reverse tethering across device reboots "
            "during the test (via svc usb setScreenUnlockedFunctions rndis and "
            "SystemStateManager post-reboot restoration). Default is true."
    }
  ];

  optional int64 connectivity_timeout_sec = 2 [
    default = 30,
    (field_detail) = {
      help: "Timeout in seconds to verify network connectivity after enabling "
            "USB reverse tethering. Default is 30."
    }
  ];

  optional string connectivity_check_host = 3 [(field_detail) = {
    help: "Optional hostname or IP to ping when verifying network connectivity. "
          "Defaults to location-aware host (www.google.com / www.gstatic.com)."
  }];
}
